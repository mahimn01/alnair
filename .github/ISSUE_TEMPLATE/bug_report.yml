name: Bug report
description: Something in Alnair doesn't work the way the README says
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. alnair --dry-run "..."
        2. ...
  - type: textarea
    id: doctor
    attributes:
      label: Output of `alnair doctor`
      description: Remove anything private before pasting. It contains no secrets, but it does show your paths.
      render: json
  - type: input
    id: versions
    attributes:
      label: OS, Python, Node and Claude Code versions
      placeholder: macOS 26.1, Python 3.13, Node 24, Claude Code 2.1.326
    validations:
      required: true
