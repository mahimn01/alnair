name: Feature request
description: Suggest a change or a new feature
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem first, then the fix you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed change
