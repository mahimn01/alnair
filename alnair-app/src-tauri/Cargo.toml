[package]
name = "alnair"
version = "0.1.0"
edition = "2021"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
window-vibrancy = "0.6"
jsonschema = { version = "0.33", default-features = false }
# Rust 1.95 + current macOS dyld rejects stripped proc-macro dylibs.
# Build-time libraries do not ship in the app. rust-lang/rust#157750.
[profile.release.build-override]
strip = false
